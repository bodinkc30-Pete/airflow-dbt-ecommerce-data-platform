services:
  postgres:
    image: postgres:17.10
    container_name: ecommerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-ecommerce}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build: .
    image: ecommerce-airflow:3.3.0-python3.12
    container_name: airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow/src

      DATA_MODE: ${DATA_MODE:-demo}
      DATA_DEMO_DIR: ${DATA_DEMO_DIR:-data/demo}
      DATA_PRIVATE_DIR: ${DATA_PRIVATE_DIR:-data/private}
      DATA_RAW_DIR: ${DATA_RAW_DIR:-data/raw}
      DATA_PROCESSED_DIR: ${DATA_PROCESSED_DIR:-data/processed}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev_jwt_secret_change_me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev_api_secret_change_me}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt

    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow pools set postgres_ingestion 2 "PostgreSQL ingestion work"
        airflow pools set dbt_transform 1 "Serialized dbt transformations"

  airflow-api-server:
    build: .
    image: ecommerce-airflow:3.3.0-python3.12
    container_name: airflow-api-server
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow/src

      DATA_MODE: ${DATA_MODE:-demo}
      DATA_DEMO_DIR: ${DATA_DEMO_DIR:-data/demo}
      DATA_PRIVATE_DIR: ${DATA_PRIVATE_DIR:-data/private}
      DATA_RAW_DIR: ${DATA_RAW_DIR:-data/raw}
      DATA_PROCESSED_DIR: ${DATA_PROCESSED_DIR:-data/processed}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev_jwt_secret_change_me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev_api_secret_change_me}

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt

    command: api-server

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: .
    image: ecommerce-airflow:3.3.0-python3.12
    container_name: airflow-scheduler
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__BASE_URL: http://airflow-api-server:8080
      PYTHONPATH: /opt/airflow/src

      DATA_MODE: ${DATA_MODE:-demo}
      DATA_DEMO_DIR: ${DATA_DEMO_DIR:-data/demo}
      DATA_PRIVATE_DIR: ${DATA_PRIVATE_DIR:-data/private}
      DATA_RAW_DIR: ${DATA_RAW_DIR:-data/raw}
      DATA_PROCESSED_DIR: ${DATA_PROCESSED_DIR:-data/processed}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_POSTGRES_HOST: ${DBT_POSTGRES_HOST:-postgres}
      DBT_POSTGRES_PORT: ${DBT_POSTGRES_PORT:-5432}
      DBT_POSTGRES_DB: ${DBT_POSTGRES_DB:-ecommerce}
      DBT_POSTGRES_USER: ${DBT_POSTGRES_USER:-airflow}
      DBT_POSTGRES_PASSWORD: ${DBT_POSTGRES_PASSWORD:-change_me}
      DBT_SCHEMA: ${DBT_SCHEMA:-analytics}
      DBT_THREADS: ${DBT_THREADS:-2}

      PIPELINE_SLOW_THRESHOLD_SECONDS: ${PIPELINE_SLOW_THRESHOLD_SECONDS:-180}
      PIPELINE_ALERT_WEBHOOK_URL: ${PIPELINE_ALERT_WEBHOOK_URL:-}
      PIPELINE_ALERT_NOTIFY_WARNINGS: ${PIPELINE_ALERT_NOTIFY_WARNINGS:-false}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev_jwt_secret_change_me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev_api_secret_change_me}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt

    command: scheduler

  airflow-dag-processor:
    build: .
    image: ecommerce-airflow:3.3.0-python3.12
    container_name: airflow-dag-processor
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow/src

      DATA_MODE: ${DATA_MODE:-demo}
      DATA_DEMO_DIR: ${DATA_DEMO_DIR:-data/demo}
      DATA_PRIVATE_DIR: ${DATA_PRIVATE_DIR:-data/private}
      DATA_RAW_DIR: ${DATA_RAW_DIR:-data/raw}
      DATA_PROCESSED_DIR: ${DATA_PROCESSED_DIR:-data/processed}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev_jwt_secret_change_me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev_api_secret_change_me}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt

    command: dag-processor

  airflow-triggerer:
    build: .
    image: ecommerce-airflow:3.3.0-python3.12
    container_name: airflow-triggerer
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow/src

      DATA_MODE: ${DATA_MODE:-demo}
      DATA_DEMO_DIR: ${DATA_DEMO_DIR:-data/demo}
      DATA_PRIVATE_DIR: ${DATA_PRIVATE_DIR:-data/private}
      DATA_RAW_DIR: ${DATA_RAW_DIR:-data/raw}
      DATA_PROCESSED_DIR: ${DATA_PROCESSED_DIR:-data/processed}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev_jwt_secret_change_me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev_api_secret_change_me}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt

    command: triggerer

volumes:
  postgres_data:
