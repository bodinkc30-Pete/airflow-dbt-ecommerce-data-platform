name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dbt.txt
      - name: Compile Python
        run: python -m compileall -q src tests airflow scripts
      - name: Ruff
        run: ruff check src tests airflow scripts
      - name: Unit and static tests
        run: |
          mkdir -p reports
          pytest tests --ignore=tests/integration --junitxml=reports/pytest-unit.xml
      - name: Public repository guard
        run: python scripts/validate_public_repo.py
      - name: Deployment static validation
        run: python scripts/validate_deployment.py --static-only
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: reports
          if-no-files-found: ignore

  data-integration:
    name: PostgreSQL + dbt Integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ci_postgres_password
      DBT_POSTGRES_HOST: 127.0.0.1
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_DB: ecommerce
      DBT_POSTGRES_USER: airflow
      DBT_POSTGRES_PASSWORD: ci_postgres_password
      DBT_POSTGRES_ROLE: ecommerce_transformer
      DBT_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dbt.txt
      - name: Bootstrap clean database
        run: python scripts/bootstrap_ci_database.py --seed --repeat 2
      - name: dbt debug
        working-directory: dbt
        run: dbt debug --profiles-dir .
      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness --profiles-dir .
      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: PostgreSQL integration tests
        run: |
          mkdir -p reports
          pytest tests/integration --junitxml=reports/pytest-integration.xml
      - name: Upload dbt and integration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-integration-artifacts
          path: |
            reports
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/sources.json
          if-no-files-found: ignore

  docker-deployment:
    name: Hardened Docker Runtime
    needs: [quality, data-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dbt.txt
      - name: Prepare runtime directories
        run: mkdir -p data/demo logs reports
      - name: Start hardened stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Bootstrap application database
        run: python scripts/bootstrap_ci_database.py --seed --repeat 2
      - name: Validate deployment runtime
        run: python scripts/validate_deployment.py
      - name: Run Airflow smoke DAG
        run: python scripts/run_ci_airflow_smoke.py --timeout 300
      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > reports/docker-compose.log
      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-deployment-artifacts
          path: reports
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: docker compose down -v
