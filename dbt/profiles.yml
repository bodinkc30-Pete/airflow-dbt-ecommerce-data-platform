project06_ecommerce:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'airflow') }}"
      pass: "{{ env_var('DBT_POSTGRES_PASSWORD', 'change_me') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DB', 'ecommerce') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"
      connect_timeout: 10
      retries: 1
